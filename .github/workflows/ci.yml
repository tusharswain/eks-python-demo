name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise without a backend
        run: terraform init -backend=false
        working-directory: terraform

      - name: Validate configuration
        run: terraform validate
        working-directory: terraform

  image:
    name: Application image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: eks-python-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container and check its health endpoint
        run: |
          docker run -d --name eks-ci -p 5000:5000 eks-python-demo:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy"
          docker logs eks-ci
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f eks-ci || true
